name: Build SteadyLock AAR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Create Plugin Project Structure
        run: |
          mkdir -p plugin/libs
          mkdir -p plugin/src/main/java/com/thakurgdev/soniclock

          curl -L -o plugin/libs/godot-lib.aar "https://github.com/godotengine/godot/releases/download/4.3-stable/godot-lib.4.3.stable.template_release.aar"

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SystemAudioLockerProject"
          include(":plugin")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.library' version '8.3.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > plugin/build.gradle
          plugins {
              id 'com.android.library'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.thakurgdev.soniclock'
              compileSdk 34

              defaultConfig {
                  minSdk 26
                  targetSdk 34
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              compileOnly files('libs/godot-lib.aar')
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat << 'EOF' > plugin/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application>
                  <meta-data
                      android:name="org.godotengine.plugin.v2.SystemAudioLocker"
                      android:value="com.thakurgdev.soniclock.SystemAudioLocker" />

                  <service
                      android:name="com.thakurgdev.soniclock.AudioLockService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />

                  <receiver
                      android:name="com.thakurgdev.soniclock.NotifActionReceiver"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > plugin/src/main/java/com/thakurgdev/soniclock/SystemAudioLocker.kt
          package com.thakurgdev.soniclock

          import android.app.*
          import android.content.*
          import android.content.pm.ServiceInfo
          import android.media.*
          import android.media.audiofx.*
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import androidx.core.app.NotificationCompat
          import org.godotengine.godot.Godot
          import org.godotengine.godot.plugin.GodotPlugin
          import org.godotengine.godot.plugin.UsedByGodot
          import java.util.concurrent.ConcurrentHashMap
          import kotlin.math.roundToInt

          class SystemAudioLocker(godot: Godot) : GodotPlugin(godot) {

              override fun getPluginName(): String = "SystemAudioLocker"

              @UsedByGodot
              fun request_background_permissions() {
                  val act = activity ?: return
                  try {
                      val pm = act.getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(act.packageName)) {
                          val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                              data = Uri.parse("package:${act.packageName}")
                          }
                          act.startActivity(intent)
                      }
                  } catch (_: Throwable) {}
              }

              @UsedByGodot
              fun apply_audio_profile(mode: Int, masterVol: Int, bassVol: Int, trebleVol: Int, isPaused: Boolean) {
                  val ctx = activity?.applicationContext ?: return
                  AudioLockService.currentMode = mode.coerceIn(0, 2)
                  AudioLockService.masterVol = masterVol.coerceIn(0, 300)
                  AudioLockService.bassVol = bassVol.coerceIn(0, 300)
                  AudioLockService.trebleVol = trebleVol.coerceIn(0, 300)
                  AudioLockService.isPaused = isPaused

                  val intent = Intent(ctx, AudioLockService::class.java).apply {
                      action = AudioLockService.ACTION_APPLY_FROM_UI
                  }
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          ctx.startForegroundService(intent)
                      } else {
                          ctx.startService(intent)
                      }
                  } catch (_: Throwable) {}
              }

              @UsedByGodot
              fun stop_audio_service() {
                  val ctx = activity?.applicationContext ?: return
                  try {
                      ctx.stopService(Intent(ctx, AudioLockService::class.java))
                  } catch (_: Throwable) {}
              }

              @UsedByGodot
              fun consume_external_sync(): Boolean {
                  val changed = AudioLockService.externalSyncPending
                  if (changed) {
                      AudioLockService.externalSyncPending = false
                  }
                  return changed
              }

              @UsedByGodot
              fun get_master_vol(): Int = AudioLockService.masterVol

              @UsedByGodot
              fun get_bass_vol(): Int = AudioLockService.bassVol

              @UsedByGodot
              fun get_treble_vol(): Int = AudioLockService.trebleVol

              @UsedByGodot
              fun get_current_mode(): Int = AudioLockService.currentMode

              @UsedByGodot
              fun is_audio_paused(): Boolean = AudioLockService.isPaused
          }

          class AudioLockService : Service() {

              companion object {
                  const val CHANNEL_ID = "steadylock_audio_channel_v2"
                  const val NOTIF_ID = 1001

                  const val ACTION_APPLY_FROM_UI = "com.thakurgdev.soniclock.APPLY_UI"
                  const val ACTION_VOL_DOWN = "com.thakurgdev.soniclock.VOL_DOWN"
                  const val ACTION_VOL_UP = "com.thakurgdev.soniclock.VOL_UP"
                  const val ACTION_CYCLE_MODE = "com.thakurgdev.soniclock.CYCLE_MODE"

                  @Volatile var currentMode: Int = 0
                  @Volatile var masterVol: Int = 100
                  @Volatile var bassVol: Int = 100
                  @Volatile var trebleVol: Int = 100
                  @Volatile var isPaused: Boolean = false
                  @Volatile var externalSyncPending: Boolean = false

                  var instance: AudioLockService? = null
              }

              private val mainHandler = Handler(Looper.getMainLooper())
              private var lastNotifTime = 0L

              private val loudnessMap = ConcurrentHashMap<Int, LoudnessEnhancer>()
              private val eqMap = ConcurrentHashMap<Int, Equalizer>()
              private val bassMap = ConcurrentHashMap<Int, BassBoost>()
              private val dpMap = ConcurrentHashMap<Int, DynamicsProcessing>()

              private val notifUpdateRunnable = Runnable {
                  postNotificationNow()
              }

              private val lockEnforcerRunnable = object : Runnable {
                  override fun run() {
                      if (!isPaused && currentMode == 0) {
                          enforceStreamVolume(masterVol)
                      }
                      mainHandler.postDelayed(this, 500L)
                  }
              }

              private val audioSessionReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val sessionId = intent?.getIntExtra(AudioEffect.EXTRA_AUDIO_SESSION, 0) ?: 0
                      if (sessionId <= 0) return
                      when (intent?.action) {
                          AudioEffect.ACTION_OPEN_AUDIO_EFFECT_CONTROL_SESSION -> {
                              attachSessionEffects(sessionId)
                              applyEffectsToSession(sessionId)
                          }
                          AudioEffect.ACTION_CLOSE_AUDIO_EFFECT_CONTROL_SESSION -> {
                              releaseSessionEffects(sessionId)
                          }
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  createNotificationChannel()

                  attachSessionEffects(0)

                  val filter = IntentFilter().apply {
                      addAction(AudioEffect.ACTION_OPEN_AUDIO_EFFECT_CONTROL_SESSION)
                      addAction(AudioEffect.ACTION_CLOSE_AUDIO_EFFECT_CONTROL_SESSION)
                  }
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          registerReceiver(audioSessionReceiver, filter, Context.RECEIVER_EXPORTED)
                      } else {
                          registerReceiver(audioSessionReceiver, filter)
                      }
                  } catch (_: Throwable) {}

                  mainHandler.post(lockEnforcerRunnable)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val notif = buildNotification()
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                          startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                      } else {
                          startForeground(NOTIF_ID, notif)
                      }
                  } catch (_: Throwable) {}

                  refreshAllAudio()
                  scheduleNotificationUpdate(immediate = true)
                  return START_STICKY
              }

              fun refreshAllAudio() {
                  if (!isPaused) {
                      enforceStreamVolume(masterVol)
                  }

                  if (!loudnessMap.containsKey(0) && !eqMap.containsKey(0)) {
                      attachSessionEffects(0)
                  }

                  val sessions = HashSet<Int>()
                  sessions.add(0)
                  sessions.addAll(loudnessMap.keys)
                  sessions.addAll(eqMap.keys)
                  sessions.addAll(dpMap.keys)

                  for (sid in sessions) {
                      applyEffectsToSession(sid)
                  }
              }

              private fun enforceStreamVolume(volPercent: Int) {
                  try {
                      val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      val maxHw = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                      val currentHw = am.getStreamVolume(AudioManager.STREAM_MUSIC)

                      if (volPercent <= 100) {
                          val targetHw = ((volPercent / 100.0) * maxHw).roundToInt().coerceIn(0, maxHw)
                          if (currentHw != targetHw) {
                              am.setStreamVolume(AudioManager.STREAM_MUSIC, targetHw, 0)
                          }
                      } else {
                          if (currentHw < maxHw) {
                              am.setStreamVolume(AudioManager.STREAM_MUSIC, maxHw, 0)
                          }
                      }
                  } catch (_: Throwable) {}
              }

              private fun attachSessionEffects(sessionId: Int) {
                  if (!loudnessMap.containsKey(sessionId)) {
                      try {
                          val le = LoudnessEnhancer(sessionId)
                          le.enabled = true
                          loudnessMap[sessionId] = le
                      } catch (_: Throwable) {}
                  }

                  if (!eqMap.containsKey(sessionId)) {
                      try {
                          val eq = Equalizer(100, sessionId)
                          eq.enabled = true
                          eqMap[sessionId] = eq
                      } catch (_: Throwable) {}
                  }

                  if (!bassMap.containsKey(sessionId)) {
                      try {
                          val bb = BassBoost(100, sessionId)
                          bb.enabled = true
                          bassMap[sessionId] = bb
                      } catch (_: Throwable) {}
                  }

                  if (sessionId > 0 && !dpMap.containsKey(sessionId) && Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      try {
                          val builder = DynamicsProcessing.Config.Builder(
                              DynamicsProcessing.VARIANT_FAVOR_FREQUENCY_RESOLUTION,
                              2,
                              true, 5,
                              false, 0,
                              false, 0,
                              true
                          )
                          val dp = DynamicsProcessing(100, sessionId, builder.build())
                          dp.enabled = true
                          dpMap[sessionId] = dp
                      } catch (_: Throwable) {}
                  }
              }

              private fun applyEffectsToSession(sessionId: Int) {
                  val active = !isPaused

                  loudnessMap[sessionId]?.let { le ->
                      try {
                          if (!active) {
                              le.setTargetGain(0)
                              le.enabled = false
                          } else {
                              val boostPercent = (masterVol - 100).coerceAtLeast(0)
                              val modeMultiplier = when (currentMode) {
                                  0 -> 30
                                  1 -> 60
                                  else -> 90
                              }
                              val gainMb = boostPercent * modeMultiplier
                              le.setTargetGain(gainMb)
                              le.enabled = true
                          }
                      } catch (_: Throwable) {}
                  }

                  eqMap[sessionId]?.let { eq ->
                      try {
                          if (!active) {
                              eq.enabled = false
                          } else {
                              eq.enabled = true
                              val numBands = eq.numberOfBands.toInt()
                              val range = eq.bandLevelRange
                              val minMb = range[0].toInt()
                              val maxMb = range[1].toInt()

                              val masterExtraMb = if (masterVol > 100) ((masterVol - 100) * 8) else 0
                              val bassDeltaMb = (bassVol - 100) * 8
                              val trebleDeltaMb = (trebleVol - 100) * 8

                              for (b in 0 until numBands) {
                                  val freqMilliHz = eq.getCenterFreq(b.toShort())
                                  var targetMb = masterExtraMb

                                  if (freqMilliHz < 300_000) {
                                      targetMb += bassDeltaMb
                                      if (currentMode == 2) targetMb += 500
                                  } else if (freqMilliHz > 2_500_000) {
                                      targetMb += trebleDeltaMb
                                      if (currentMode == 0) targetMb += 300
                                  } else {
                                      if (currentMode == 0) targetMb += 400
                                  }

                                  val clamped = targetMb.coerceIn(minMb, maxMb).toShort()
                                  eq.setBandLevel(b.toShort(), clamped)
                              }
                          }
                      } catch (_: Throwable) {}
                  }

                  bassMap[sessionId]?.let { bb ->
                      try {
                          if (!active) {
                              bb.enabled = false
                          } else {
                              bb.enabled = true
                              val strength = ((bassVol / 300.0) * 1000.0).roundToInt().coerceIn(0, 1000).toShort()
                              bb.setStrength(strength)
                          }
                      } catch (_: Throwable) {}
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      dpMap[sessionId]?.let { dp ->
                          try {
                              if (!active) {
                                  dp.enabled = false
                              } else {
                                  dp.enabled = true
                                  val inputGainDb = if (masterVol > 100) ((masterVol - 100) * 0.3f) else 0f
                                  dp.setInputGainAllChannelsTo(inputGainDb)

                                  val limiter = if (currentMode == 0) {
                                      DynamicsProcessing.Limiter(true, true, 0, 0.1f, 10.0f, 35.0f, -4.0f, 0.0f)
                                  } else {
                                      DynamicsProcessing.Limiter(true, true, 0, 2.0f, 40.0f, 5.0f, -1.0f, 0.0f)
                                  }
                                  dp.setLimiterAllChannelsTo(limiter)
                              }
                          } catch (_: Throwable) {}
                      }
                  }
              }

              private fun releaseSessionEffects(sessionId: Int) {
                  try { loudnessMap.remove(sessionId)?.release() } catch (_: Throwable) {}
                  try { eqMap.remove(sessionId)?.release() } catch (_: Throwable) {}
                  try { bassMap.remove(sessionId)?.release() } catch (_: Throwable) {}
                  try { dpMap.remove(sessionId)?.release() } catch (_: Throwable) {}
              }

              fun scheduleNotificationUpdate(immediate: Boolean) {
                  mainHandler.removeCallbacks(notifUpdateRunnable)
                  val now = SystemClock.elapsedRealtime()
                  if (immediate || (now - lastNotifTime) > 200L) {
                      postNotificationNow()
                      mainHandler.postDelayed(notifUpdateRunnable, 100L)
                  } else {
                      mainHandler.postDelayed(notifUpdateRunnable, 100L)
                  }
              }

              private fun postNotificationNow() {
                  lastNotifTime = SystemClock.elapsedRealtime()
                  try {
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.notify(NOTIF_ID, buildNotification())
                  } catch (_: Throwable) {}
              }

              private fun buildNotification(): Notification {
                  val modeTitle = when {
                      isPaused -> "PAUSED (Bypass)"
                      currentMode == 0 -> "Steady Lock"
                      currentMode == 1 -> "Boost + EQ"
                      else -> "Cinema Bass"
                  }

                  val launchIntent = packageManager.getLaunchIntentForPackage(packageName)?.apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val contentPi = PendingIntent.getActivity(
                      this, 0, launchIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val downPi = PendingIntent.getBroadcast(
                      this, 1,
                      Intent(this, NotifActionReceiver::class.java).setAction(ACTION_VOL_DOWN),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val upPi = PendingIntent.getBroadcast(
                      this, 2,
                      Intent(this, NotifActionReceiver::class.java).setAction(ACTION_VOL_UP),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val modePi = PendingIntent.getBroadcast(
                      this, 3,
                      Intent(this, NotifActionReceiver::class.java).setAction(ACTION_CYCLE_MODE),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val thirdBtnLabel = if (isPaused) "▶ Resume" else "🔄 Mode"

                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_lock_silent_mode_off)
                      .setContentTitle("SteadyLock • $modeTitle ($masterVol%)")
                      .setContentText("Vol: $masterVol%  |  Bass: $bassVol%  |  Treble: $trebleVol%")
                      .setOngoing(!isPaused)
                      .setOnlyAlertOnce(true)
                      .setSilent(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setContentIntent(contentPi)
                      .addAction(0, "➖ 10%", downPi)
                      .addAction(0, "➕ 10%", upPi)
                      .addAction(0, thirdBtnLabel, modePi)
                      .build()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "SteadyLock Live Controls",
                          NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          description = "Live Volume, Mode Switch & Audio Lock Controls"
                          setShowBadge(false)
                      }
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.createNotificationChannel(channel)
                  }
              }

              override fun onDestroy() {
                  mainHandler.removeCallbacksAndMessages(null)
                  try { unregisterReceiver(audioSessionReceiver) } catch (_: Throwable) {}
                  for (sid in HashSet(loudnessMap.keys)) {
                      releaseSessionEffects(sid)
                  }
                  instance = null
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }

          class NotifActionReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  when (intent?.action) {
                      AudioLockService.ACTION_VOL_DOWN -> {
                          AudioLockService.isPaused = false
                          AudioLockService.masterVol = (AudioLockService.masterVol - 10).coerceIn(0, 300)
                      }
                      AudioLockService.ACTION_VOL_UP -> {
                          AudioLockService.isPaused = false
                          AudioLockService.masterVol = (AudioLockService.masterVol + 10).coerceIn(0, 300)
                      }
                      AudioLockService.ACTION_CYCLE_MODE -> {
                          if (AudioLockService.isPaused) {
                              AudioLockService.isPaused = false
                              AudioLockService.currentMode = 0
                          } else if (AudioLockService.currentMode < 2) {
                                AudioLockService.currentMode += 1
                          } else {
                              AudioLockService.isPaused = true
                          }
                      }
                  }

                  AudioLockService.externalSyncPending = true
                  AudioLockService.instance?.let { svc ->
                      svc.refreshAllAudio()
                      svc.scheduleNotificationUpdate(immediate = true)
                  }
              }
          }
          EOF

      - name: Build Release AAR
        run: gradle :plugin:assembleRelease --no-daemon

      - name: Prepare Output AAR
        run: |
          mkdir -p output
          cp plugin/build/outputs/aar/plugin-release.aar output/SystemAudioLocker-release.aar

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemAudioLocker-AAR
          path: output/SystemAudioLocker-release.aar
