name: Build SteadyLock AAR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Create Plugin Project Structure
        run: |
          mkdir -p plugin/libs
          mkdir -p plugin/src/main/java/com/thakurgdev/soniclock

          curl -L -o plugin/libs/godot-lib.aar "https://github.com/godotengine/godot/releases/download/4.3-stable/godot-lib.4.3.stable.template_release.aar"

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SystemAudioLockerProject"
          include(":plugin")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.library' version '8.3.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > plugin/build.gradle
          plugins {
              id 'com.android.library'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.thakurgdev.soniclock'
              compileSdk 34

              defaultConfig {
                  minSdk 26
                  targetSdk 34
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              compileOnly files('libs/godot-lib.aar')
          }
          EOF

          cat << 'EOF' > plugin/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application>
                  <meta-data
                      android:name="org.godotengine.plugin.v2.SystemAudioLocker"
                      android:value="com.thakurgdev.soniclock.SystemAudioLocker" />

                  <service
                      android:name="com.thakurgdev.soniclock.AudioLockService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > plugin/src/main/java/com/thakurgdev/soniclock/SystemAudioLocker.kt
          package com.thakurgdev.soniclock

          import android.app.*
          import android.content.*
          import android.content.pm.ServiceInfo
          import android.media.*
          import android.media.audiofx.*
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import org.godotengine.godot.Godot
          import org.godotengine.godot.plugin.GodotPlugin
          import org.godotengine.godot.plugin.UsedByGodot
          import java.util.concurrent.ConcurrentHashMap
          import kotlin.math.roundToInt

          class SystemAudioLocker(godot: Godot) : GodotPlugin(godot) {

              override fun getPluginName(): String = "SystemAudioLocker"

              @UsedByGodot
              fun request_background_permissions() {
                  val act = activity ?: return
                  try {
                      if (Build.VERSION.SDK_INT >= 33) {
                          act.requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 101)
                      }
                  } catch (_: Throwable) {}
                  try {
                      val pm = act.getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(act.packageName)) {
                          val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                              data = Uri.parse("package:${act.packageName}")
                          }
                          act.startActivity(intent)
                      }
                  } catch (_: Throwable) {}
              }

              @UsedByGodot
              fun apply_audio_profile(mode: Int, masterVol: Int, bassVol: Int, trebleVol: Int, isPaused: Boolean) {
                  val ctx = activity?.applicationContext ?: return
                  val newMaster = masterVol.coerceIn(0, 300)
                  val masterChanged = (AudioLockService.masterVol != newMaster)

                  AudioLockService.currentMode = mode.coerceIn(0, 2)
                  AudioLockService.masterVol = newMaster
                  AudioLockService.bassVol = bassVol.coerceIn(0, 300)
                  AudioLockService.trebleVol = trebleVol.coerceIn(0, 300)
                  AudioLockService.isPaused = isPaused

                  // Only change hardware stream volume when the user actually changed masterVol in the app
                  if (!isPaused && masterChanged) {
                      AudioLockService.setHardwareVolumeOnce(ctx, newMaster)
                  }

                  // Apply GOODEV-style LoudnessEnhancer & Steady Lock DRC immediately
                  AudioLockService.applyDspEngine()
                  AudioLockService.ensureChannelAndPostNotif(ctx)

                  val intent = Intent(ctx, AudioLockService::class.java).apply {
                      action = AudioLockService.ACTION_APPLY_FROM_UI
                  }
                  try {
                      ctx.startService(intent)
                  } catch (_: Throwable) {
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              ctx.startForegroundService(intent)
                          }
                      } catch (_: Throwable) {}
                  }
              }

              @UsedByGodot
              fun stop_audio_service() {
                  val ctx = activity?.applicationContext ?: return
                  try {
                      AudioLockService.releaseAllEnhancers()
                      ctx.stopService(Intent(ctx, AudioLockService::class.java))
                  } catch (_: Throwable) {}
              }

              @UsedByGodot
              fun consume_external_sync(): Boolean {
                  val changed = AudioLockService.externalSyncPending
                  if (changed) {
                      AudioLockService.externalSyncPending = false
                  }
                  return changed
              }

              @UsedByGodot
              fun get_master_vol(): Int = AudioLockService.masterVol

              @UsedByGodot
              fun get_bass_vol(): Int = AudioLockService.bassVol

              @UsedByGodot
              fun get_treble_vol(): Int = AudioLockService.trebleVol

              @UsedByGodot
              fun get_current_mode(): Int = AudioLockService.currentMode

              @UsedByGodot
              fun is_audio_paused(): Boolean = AudioLockService.isPaused
          }

          class AudioLockService : Service() {

              companion object {
                  const val CHANNEL_ID = "steadylock_goodev_channel_v4"
                  const val NOTIF_ID = 1001

                  const val ACTION_APPLY_FROM_UI = "com.thakurgdev.soniclock.APPLY_UI"
                  const val ACTION_VOL_DOWN = "com.thakurgdev.soniclock.VOL_DOWN"
                  const val ACTION_VOL_UP = "com.thakurgdev.soniclock.VOL_UP"
                  const val ACTION_CYCLE_MODE = "com.thakurgdev.soniclock.CYCLE_MODE"

                  @Volatile var currentMode: Int = 0
                  @Volatile var masterVol: Int = 100
                  @Volatile var bassVol: Int = 100
                  @Volatile var trebleVol: Int = 100
                  @Volatile var isPaused: Boolean = false
                  @Volatile var externalSyncPending: Boolean = false
                  @Volatile var lastAppHwSetTime: Long = 0L

                  private val mainHandler = Handler(Looper.getMainLooper())
                  private var lastNotifTime = 0L

                  // Pure GOODEV Architecture: ONLY LoudnessEnhancer on Session 0 & active sessions
                  // (No Equalizer(0) or BassBoost(0) that conflicts with Xiaomi HyperOS HAL!)
                  private var globalEnhancer: LoudnessEnhancer? = null
                  private val sessionEnhancers = ConcurrentHashMap<Int, LoudnessEnhancer>()

                  fun setHardwareVolumeOnce(ctx: Context, volPercent: Int) {
                      try {
                          lastAppHwSetTime = SystemClock.elapsedRealtime()
                          val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          val maxHw = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                          val targetHw = if (volPercent <= 100) {
                              ((volPercent / 100.0) * maxHw).roundToInt().coerceIn(0, maxHw)
                          } else {
                              maxHw
                          }
                          if (am.getStreamVolume(AudioManager.STREAM_MUSIC) != targetHw) {
                              am.setStreamVolume(AudioManager.STREAM_MUSIC, targetHw, 0)
                          }
                      } catch (_: Throwable) {}
                  }

                  fun computeTargetGainMb(): Int {
                      if (isPaused) return 0

                      return if (currentMode == 0) {
                          // MODE 0: STEADY LOCK (Constant Decibel Level Compressor)
                          // Feeds strong +2800 mB (+28 dB) drive into LoudnessEnhancer's internal 0 dBFS DRC limiter.
                          // Quiet whispers/music are pulled up by +28 dB while loud beats are clamped at 0 dBFS!
                          val baseCompressionDrive = 2800
                          val toneDrive = ((bassVol - 50) * 8) + ((trebleVol - 50) * 8)
                          val extraBoost = (masterVol - 100).coerceAtLeast(0) * 28
                          (baseCompressionDrive + toneDrive + extraBoost).coerceIn(800, 9000)
                      } else {
                          // MODE 1: DYNAMIC BOOST (Pure Volume Booster GOODEV Engine)
                          val boostAbove100 = (masterVol - 100).coerceAtLeast(0)
                          val bassExtra = (bassVol - 100).coerceAtLeast(0) * 8
                          val trebleExtra = (trebleVol - 100).coerceAtLeast(0) * 8
                          // At 200% -> 3200 mB (+32 dB); at 300% -> 6400 mB (+64 dB)
                          ((boostAbove100 * 32) + bassExtra + trebleExtra).coerceIn(0, 9000)
                      }
                  }

                  fun applyDspEngine() {
                      val gainMb = computeTargetGainMb()
                      val shouldEnable = (!isPaused && gainMb > 0)

                      // 1. Apply to Global Mix (Session 0 - exactly how Volume Booster GOODEV works)
                      try {
                          if (globalEnhancer == null) {
                              globalEnhancer = LoudnessEnhancer(0)
                          }
                          globalEnhancer?.setTargetGain(gainMb)
                          globalEnhancer?.enabled = shouldEnable
                      } catch (_: Throwable) {
                          try { globalEnhancer?.release() } catch (_: Throwable) {}
                          globalEnhancer = null
                          try {
                              globalEnhancer = LoudnessEnhancer(0).apply {
                                  setTargetGain(gainMb)
                                  enabled = shouldEnable
                              }
                          } catch (_: Throwable) {}
                      }

                      // 2. Also apply to any individual app sessions
                      for ((sid, le) in sessionEnhancers) {
                          try {
                              le.setTargetGain(gainMb)
                              le.enabled = shouldEnable
                          } catch (_: Throwable) {
                              sessionEnhancers.remove(sid)
                          }
                      }
                  }

                  fun attachAppSession(sessionId: Int) {
                      if (sessionId <= 0) return
                      val gainMb = computeTargetGainMb()
                      val shouldEnable = (!isPaused && gainMb > 0)
                      try {
                          val le = sessionEnhancers.getOrPut(sessionId) { LoudnessEnhancer(sessionId) }
                          le.setTargetGain(gainMb)
                          le.enabled = shouldEnable
                      } catch (_: Throwable) {}
                  }

                  fun releaseAllEnhancers() {
                      try { globalEnhancer?.release() } catch (_: Throwable) {}
                      globalEnhancer = null
                      for ((_, le) in sessionEnhancers) {
                          try { le.release() } catch (_: Throwable) {}
                      }
                      sessionEnhancers.clear()
                  }

                  fun ensureChannelAndPostNotif(ctx: Context, immediate: Boolean = false) {
                      createNotificationChannel(ctx)
                      val now = SystemClock.elapsedRealtime()
                      if (immediate || (now - lastNotifTime) > 180L) {
                          postNotifNow(ctx)
                          mainHandler.postDelayed({ postNotifNow(ctx) }, 140L)
                      } else {
                          mainHandler.postDelayed({ postNotifNow(ctx) }, 120L)
                      }
                  }

                  private fun postNotifNow(ctx: Context) {
                      lastNotifTime = SystemClock.elapsedRealtime()
                      try {
                          val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                          nm.notify(NOTIF_ID, buildNotification(ctx))
                      } catch (_: Throwable) {}
                  }

                  fun createNotificationChannel(ctx: Context) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val channel = NotificationChannel(
                              CHANNEL_ID,
                              "SteadyLock Audio Controls",
                              NotificationManager.IMPORTANCE_LOW
                          ).apply {
                              description = "Live Volume Booster & Steady Lock Controls"
                              setShowBadge(false)
                          }
                          val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                          nm.createNotificationChannel(channel)
                      }
                  }

                  fun buildNotification(ctx: Context): Notification {
                      val modeTitle = when {
                          isPaused -> "PAUSED"
                          currentMode == 0 -> "Steady Lock"
                          else -> "Dynamic Boost"
                      }

                      val launchIntent = ctx.packageManager.getLaunchIntentForPackage(ctx.packageName)?.apply {
                          flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      }
                      val contentPi = PendingIntent.getActivity(
                          ctx, 0, launchIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )

                      val downPi = PendingIntent.getService(
                          ctx, 1,
                          Intent(ctx, AudioLockService::class.java).setAction(ACTION_VOL_DOWN),
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      val upPi = PendingIntent.getService(
                          ctx, 2,
                          Intent(ctx, AudioLockService::class.java).setAction(ACTION_VOL_UP),
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      val modePi = PendingIntent.getService(
                          ctx, 3,
                          Intent(ctx, AudioLockService::class.java).setAction(ACTION_CYCLE_MODE),
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )

                      val thirdBtnLabel = if (isPaused) "▶ Resume" else "🔄 Mode"

                      val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          Notification.Builder(ctx, CHANNEL_ID)
                      } else {
                          Notification.Builder(ctx)
                      }

                      return builder
                          .setSmallIcon(android.R.drawable.ic_lock_silent_mode_off)
                          .setContentTitle("SteadyLock • $modeTitle ($masterVol%)")
                          .setContentText("Vol: $masterVol%  |  Bass: $bassVol%  |  Treble: $trebleVol%")
                          .setOngoing(!isPaused)
                          .setOnlyAlertOnce(true)
                          .setContentIntent(contentPi)
                          .addAction(Notification.Action.Builder(0, "➖ 10%", downPi).build())
                          .addAction(Notification.Action.Builder(0, "➕ 10%", upPi).build())
                          .addAction(Notification.Action.Builder(0, thirdBtnLabel, modePi).build())
                          .build()
                  }
              }

              // Re-hooks Session 0 LoudnessEnhancer whenever YouTube, Reels, Spotify or Games start playing
              private val playbackCallback = object : AudioManager.AudioPlaybackCallback() {
                  override fun onPlaybackConfigChanged(configs: MutableList<AudioPlaybackConfiguration>?) {
                      super.onPlaybackConfigChanged(configs)
                      applyDspEngine()
                  }
              }

              // Listens to physical Volume Up / Volume Down buttons so phone buttons NEVER get overridden!
              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          "android.media.VOLUME_CHANGED_ACTION" -> {
                              val now = SystemClock.elapsedRealtime()
                              // If user pressed physical volume buttons (>500ms after app set volume)
                              if (now - lastAppHwSetTime > 500L && context != null) {
                                  try {
                                      val am = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                                      val maxHw = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                                      val curHw = am.getStreamVolume(AudioManager.STREAM_MUSIC)
                                      val hwPct = ((curHw.toDouble() / maxHw.toDouble()) * 100.0).roundToInt().coerceIn(0, 100)
                                      if (masterVol <= 100 || curHw < maxHw) {
                                          if (masterVol != hwPct) {
                                              masterVol = hwPct
                                              externalSyncPending = true
                                              applyDspEngine()
                                              ensureChannelAndPostNotif(context, immediate = true)
                                          }
                                      }
                                  } catch (_: Throwable) {}
                              }
                          }
                          AudioEffect.ACTION_OPEN_AUDIO_EFFECT_CONTROL_SESSION -> {
                              val sid = intent.getIntExtra(AudioEffect.EXTRA_AUDIO_SESSION, 0)
                              attachAppSession(sid)
                          }
                          AudioEffect.ACTION_CLOSE_AUDIO_EFFECT_CONTROL_SESSION -> {
                              val sid = intent.getIntExtra(AudioEffect.EXTRA_AUDIO_SESSION, 0)
                              try { sessionEnhancers.remove(sid)?.release() } catch (_: Throwable) {}
                          }
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel(this)
                  applyDspEngine()

                  try {
                      val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      am.registerAudioPlaybackCallback(playbackCallback, mainHandler)
                  } catch (_: Throwable) {}

                  val filter = IntentFilter().apply {
                      addAction("android.media.VOLUME_CHANGED_ACTION")
                      addAction(AudioEffect.ACTION_OPEN_AUDIO_EFFECT_CONTROL_SESSION)
                      addAction(AudioEffect.ACTION_CLOSE_AUDIO_EFFECT_CONTROL_SESSION)
                  }
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          registerReceiver(receiver, filter, Context.RECEIVER_EXPORTED)
                      } else {
                          registerReceiver(receiver, filter)
                      }
                  } catch (_: Throwable) {}
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_VOL_DOWN -> {
                          isPaused = false
                          masterVol = (masterVol - 10).coerceIn(0, 300)
                          setHardwareVolumeOnce(this, masterVol)
                          externalSyncPending = true
                      }
                      ACTION_VOL_UP -> {
                          isPaused = false
                          masterVol = (masterVol + 10).coerceIn(0, 300)
                          setHardwareVolumeOnce(this, masterVol)
                          externalSyncPending = true
                      }
                      ACTION_CYCLE_MODE -> {
                          if (isPaused) {
                              isPaused = false
                              currentMode = 0
                          } else if (currentMode == 0) {
                              currentMode = 1
                          } else {
                              isPaused = true
                          }
                          externalSyncPending = true
                      }
                  }

                  val notif = buildNotification(this)
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                          startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                      } else {
                          startForeground(NOTIF_ID, notif)
                      }
                  } catch (_: Throwable) {
                      try { startForeground(NOTIF_ID, notif) } catch (_: Throwable) {}
                  }

                  applyDspEngine()
                  ensureChannelAndPostNotif(this, immediate = true)
                  return START_STICKY
              }

              override fun onDestroy() {
                  mainHandler.removeCallbacksAndMessages(null)
                  try {
                      val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      am.unregisterAudioPlaybackCallback(playbackCallback)
                  } catch (_: Throwable) {}
                  try { unregisterReceiver(receiver) } catch (_: Throwable) {}
                  releaseAllEnhancers()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Build Release AAR
        run: gradle :plugin:assembleRelease --no-daemon

      - name: Prepare Output AAR
        run: |
          mkdir -p output
          cp plugin/build/outputs/aar/plugin-release.aar output/SystemAudioLocker-release.aar

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemAudioLocker-AAR
          path: output/SystemAudioLocker-release.aar
