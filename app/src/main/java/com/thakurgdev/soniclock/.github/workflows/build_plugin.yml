name: Build Godot Android Plugin

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Plugin Project Structure
        run: |
          mkdir -p app/src/main/java/com/thakurgdev/soniclock
          echo 'plugins { id "com.android.library" }' > app/build.gradle
          echo 'android { namespace "com.thakurgdev.soniclock" compileSdk 34 defaultConfig { minSdk 24 targetSdk 34 } }' >> app/build.gradle
          echo 'dependencies { implementation "org.godotengine:godot:4.2.1.stable" }' >> app/build.gradle
          echo 'include(":app")' > settings.gradle

      - name: Move Kotlin File to Gradle Source
        run: |
          cp app/src/main/java/com/thakurgdev/soniclock/SystemAudioLockerPlugin.kt app/src/main/java/com/thakurgdev/soniclock/SystemAudioLocker.kt || true

      - name: Build AAR Package
        run: |
          chmod +x gradlew || true
          ./gradlew assembleRelease || echo "Gradle wrapper missing, generating..."
          gradle wrapper
          ./gradlew assembleRelease

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemAudioLocker-release
          path: app/build/outputs/aar/app-release.aar
