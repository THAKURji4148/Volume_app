name: Build Godot Android Plugin

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Gradle Build Files
        run: |
          mkdir -p app/src/main
          echo 'android { namespace "com.thakurgdev.soniclock" compileSdk 34 defaultConfig { minSdk 24 targetSdk 34 } }' > app/build.gradle

      - name: Build AAR with Gradle
        run: |
          echo "building aar..."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemAudioLocker-release
          path: app/build.outputs/aar/
